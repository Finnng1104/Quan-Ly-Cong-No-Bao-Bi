# Builds the macOS install packages (Apple Silicon + Intel), signs the manifest and publishes it as a
# GitHub Release of a separate PUBLIC repository (this one is private, customers cannot download from it).
# Trigger: push a tag such as v1.0.3.
#
# Needs (repository settings):
#   secret   QLCN_SIGNING_KEY          private key PEM from `node server/packaging/manifest.mjs keygen`
#   secret   QLCN_RELEASES_TOKEN       fine-grained token with "Contents: read & write" on the releases repo
#   variable QLCN_RELEASES_REPO        releases repository, e.g. Finnng1104/qlcn-releases
#   variable QLCN_RELEASE_BASE_URL     https://github.com/<owner>/<repo>/releases/latest/download
# And the public keys committed under server/packaging/public-keys/ (main.public.pem, backup.public.pem).

name: release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          # Windows is verified separately by windows-smoke.yml; the customer runs macOS.
          - { os: macos-15, platform: darwin-arm64 }
          - { os: macos-15-intel, platform: darwin-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        run: npm ci
      - name: Install server dependencies
        # No install scripts: better-sqlite3 ships prebuilds, and its implicit node-gyp rebuild needs MSVC.
        run: npm ci --ignore-scripts
        working-directory: server
      - name: Build release package
        shell: bash
        working-directory: server
        run: node packaging/build-release.mjs --out release --version "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: |
            server/release/*.tar.gz
            server/release/*.json
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: server/release
          merge-multiple: true
      - name: Sign manifest and render installers
        shell: bash
        working-directory: server
        env:
          QLCN_SIGNING_KEY: ${{ secrets.QLCN_SIGNING_KEY }}
          QLCN_RELEASE_BASE_URL: ${{ vars.QLCN_RELEASE_BASE_URL }}
        run: |
          printf '%s\n' "$QLCN_SIGNING_KEY" > "$RUNNER_TEMP/signing.pem"
          node packaging/manifest.mjs publish \
            --dir release \
            --base-url "$QLCN_RELEASE_BASE_URL" \
            --key "$RUNNER_TEMP/signing.pem" \
            --public-key packaging/public-keys/main.public.pem \
            --public-key packaging/public-keys/backup.public.pem
          rm -f "$RUNNER_TEMP/signing.pem"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            server/release/*.tar.gz
            server/release/manifest.json
            server/release/manifest.sig
            server/release/manifest.sig.der
            server/release/install.sh
            server/release/install.ps1
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.QLCN_RELEASES_TOKEN }}
          RELEASES_REPO: ${{ vars.QLCN_RELEASES_REPO }}
        working-directory: server/release
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$RELEASES_REPO" \
            --title "$GITHUB_REF_NAME" --notes "Release $GITHUB_REF_NAME" \
            *.tar.gz manifest.json manifest.sig manifest.sig.der install.sh install.ps1
