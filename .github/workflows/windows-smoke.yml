# Installs the real package on a clean Windows runner with the real install.ps1, the way a customer
# would (Windows PowerShell 5.1, `irm | iex`, Administrator), and checks it comes up and the support
# command works. Nothing is published. Runs by hand or when the packaging files change.
#
# What it cannot cover: a reboot, a laptop unplugged from power, a customer's antivirus.

name: windows-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'server/packaging/**'
      - '.github/workflows/windows-smoke.yml'

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      BASE_URL: http://127.0.0.1:9100
      PORT: '8799'
      TASK_NAME: QlcnSmoke
      ADMIN_USERNAME: chu-cua-hang
      # Non-ASCII on purpose: proves the password reaches the server as UTF-8, not as "?".
      ADMIN_PASSWORD: Mật-khẩu-12345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: npm ci
      - name: Install server dependencies
        # No install scripts: better-sqlite3 ships prebuilds, and its implicit node-gyp rebuild needs MSVC.
        run: npm ci --ignore-scripts
        working-directory: server

      - name: Build package and sign with a throwaway key
        shell: bash
        working-directory: server
        run: |
          node packaging/build-release.mjs --out release --version 0.0.0
          node packaging/manifest.mjs keygen smoke --dir "$RUNNER_TEMP"
          node packaging/manifest.mjs publish \
            --dir release \
            --base-url "$BASE_URL" \
            --key "$RUNNER_TEMP/smoke.private.pem" \
            --public-key "$RUNNER_TEMP/smoke.public.pem"

      # Serves release/ the worst way a host can: .ps1 as text/plain *without* a charset, which is
      # what makes Windows PowerShell 5.1 decode the Vietnamese text as ISO-8859-1.
      - name: Start a local release host
        shell: powershell
        run: |
          $server = @'
          const http = require('node:http'), fs = require('node:fs'), path = require('node:path')
          const root = path.resolve(process.argv[2])
          http.createServer((req, res) => {
            const file = path.join(root, path.basename(new URL(req.url, 'http://x').pathname))
            if (!fs.existsSync(file)) { res.writeHead(404).end(); return }
            const text = /\.(ps1|sh|json|sig)$/.test(file)
            res.writeHead(200, { 'Content-Type': text ? 'text/plain' : 'application/octet-stream' })
            fs.createReadStream(file).pipe(res)
          }).listen(9100, '127.0.0.1')
          '@
          Set-Content -Path "$env:RUNNER_TEMP\host.cjs" -Value $server -Encoding ASCII
          Start-Process node -ArgumentList "`"$env:RUNNER_TEMP\host.cjs`"", "`"$PWD\server\release`"" -WindowStyle Hidden
          for ($i = 0; $i -lt 20; $i++) {
            try { Invoke-WebRequest -UseBasicParsing "$env:BASE_URL/manifest.json" | Out-Null; exit 0 } catch { Start-Sleep -Seconds 1 }
          }
          throw 'release host did not start'

      - name: Install (fresh)
        shell: powershell
        env:
          QLCN_BASE_URL: ${{ env.BASE_URL }}
          QLCN_TASK: ${{ env.TASK_NAME }}
          QLCN_PORT: ${{ env.PORT }}
          QLCN_ADMIN_USERNAME: ${{ env.ADMIN_USERNAME }}
          QLCN_ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
          QLCN_NO_OPEN: '1'
        run: |
          irm "$env:BASE_URL/install.ps1" | iex

      - name: Server answers and the password round-trips
        shell: powershell
        run: |
          Invoke-RestMethod "http://127.0.0.1:$env:PORT/api/health" | ConvertTo-Json
          function Test-Login([string]$Password) {
            $body = @{ username = $env:ADMIN_USERNAME; password = $Password } | ConvertTo-Json
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Method Post `
                -Uri "http://127.0.0.1:$env:PORT/api/auth/login" `
                -Headers @{ Origin = "http://127.0.0.1:$env:PORT" } `
                -ContentType 'application/json; charset=utf-8' `
                -Body ([Text.Encoding]::UTF8.GetBytes($body))
              return $response.StatusCode -eq 200
            } catch { return $false }
          }
          if (Test-Login $env:ADMIN_PASSWORD) { Write-Host 'login OK with the original password'; exit 0 }
          # Say which kind of damage the stored password has, so the next fix is not a guess.
          $asQuestionMarks = [regex]::Replace($env:ADMIN_PASSWORD, '[^\x00-\x7F]', '?')
          Write-Host ('password chars: ' + (($env:ADMIN_PASSWORD.ToCharArray() | ForEach-Object { [int]$_ }) -join ','))
          if (Test-Login $asQuestionMarks) { throw 'login works only with "?" in place of accented letters: the password was stored as ASCII' }
          throw 'login failed with the original password and with the "?" variant'

      - name: Support command
        shell: powershell
        run: |
          $qlcn = Join-Path $env:ProgramFiles 'QuanLyCongNo\app\bin\qlcn.cmd'
          & $qlcn status
          & $qlcn backup
          if ($LASTEXITCODE -ne 0) { throw 'qlcn backup failed' }
          & $qlcn backups
          schtasks.exe /Query /TN $env:TASK_NAME
          if ($LASTEXITCODE -ne 0) { throw 'scheduled task is not registered' }

      - name: Install again (must be a no-op)
        shell: powershell
        env:
          QLCN_BASE_URL: ${{ env.BASE_URL }}
          QLCN_TASK: ${{ env.TASK_NAME }}
          QLCN_PORT: ${{ env.PORT }}
          QLCN_NO_OPEN: '1'
        run: |
          irm "$env:BASE_URL/install.ps1" | iex
          Invoke-RestMethod "http://127.0.0.1:$env:PORT/api/health" | Out-Null

      # Only on failure: compare the stored password hash with the ways the password could have been
      # damaged on its way in, so the fix targets the real cause.
      - name: Password probe
        if: failure()
        shell: powershell
        run: |
          $script = @'
          import { createRequire } from 'node:module'
          import { pathToFileURL } from 'node:url'
          const [serverDir, dbPath] = process.argv.slice(2)
          const requireFromApp = createRequire(serverDir + '/package.json')
          const Database = requireFromApp('better-sqlite3')
          const { verifyPassword } = await import(pathToFileURL(serverDir + '/dist/shared/password.js').href)
          const rows = new Database(dbPath, { readonly: true }).prepare('SELECT username, password_hash FROM users').all()
          const pw = process.env.ADMIN_PASSWORD
          const bytes = Buffer.from(pw, 'utf8')
          const candidates = {
            original: pw,
            questionMark_perChar: pw.replace(/[^\x00-\x7F]/g, '?'),
            questionMark_perByte: [...bytes].map((b) => (b > 127 ? '?' : String.fromCharCode(b))).join(''),
            nonAsciiDropped: pw.replace(/[^\x00-\x7F]/g, ''),
            bomPrefix: String.fromCharCode(0xFEFF) + pw,
            crSuffix: pw + '\r',
            nfd: pw.normalize('NFD'),
            latin1Mojibake: bytes.toString('latin1'),
            utf8ReadAsCp437ish: bytes.toString('latin1').replace(/[\x80-\x9f]/g, '?'),
          }
          console.log('users:', rows.map((r) => r.username).join(', '))
          for (const row of rows) {
            for (const [name, candidate] of Object.entries(candidates)) {
              if (await verifyPassword(candidate, row.password_hash)) console.log('MATCH', row.username, '<-', name)
            }
          }
          console.log('probe finished')
          '@
          $file = Join-Path $env:RUNNER_TEMP 'probe.mjs'
          Set-Content -Path $file -Value $script -Encoding UTF8
          $app = Join-Path $env:ProgramFiles 'QuanLyCongNo\app'
          & (Join-Path $app 'runtime\node.exe') $file (Join-Path $app 'server') (Join-Path $env:ProgramData 'QuanLyCongNo\data\app.db')

          # Same check on a throwaway data dir, feeding the password the two ways we know about.
          $node = Join-Path $app 'runtime\node.exe'
          $main = Join-Path $app 'server\dist\main.js'
          $password = $env:ADMIN_PASSWORD
          Write-Host ('expected stdin bytes: ' + ((New-Object Text.UTF8Encoding($false)).GetBytes($password + "`n") | ForEach-Object { $_.ToString('x2') }) -join ' ')

          # A: raw UTF-8 bytes through .NET Process (what install.ps1 does)
          $dirA = Join-Path $env:RUNNER_TEMP 'probe-a'; New-Item -ItemType Directory -Force $dirA | Out-Null
          $startInfo = New-Object Diagnostics.ProcessStartInfo
          $startInfo.FileName = $node
          $startInfo.Arguments = "`"$main`" init-admin --data-dir `"$dirA`" --username probe --password-stdin"
          $startInfo.UseShellExecute = $false; $startInfo.CreateNoWindow = $true
          $startInfo.RedirectStandardInput = $true; $startInfo.RedirectStandardOutput = $true; $startInfo.RedirectStandardError = $true
          $process = [Diagnostics.Process]::Start($startInfo)
          $bytes = (New-Object Text.UTF8Encoding($false)).GetBytes("$password`n")
          $process.StandardInput.BaseStream.Write($bytes, 0, $bytes.Length)
          $process.StandardInput.Close()
          Write-Host ('A stdout: ' + $process.StandardOutput.ReadToEnd() + $process.StandardError.ReadToEnd())
          $process.WaitForExit()
          Write-Host 'A matches:'
          & $node $file (Join-Path $app 'server') (Join-Path $dirA 'data\app.db')

          # B: plain PowerShell pipe with the global encoding set to UTF-8
          $dirB = Join-Path $env:RUNNER_TEMP 'probe-b'; New-Item -ItemType Directory -Force $dirB | Out-Null
          $global:OutputEncoding = New-Object Text.UTF8Encoding($false)
          $password | & $node $main init-admin --data-dir $dirB --username probe --password-stdin
          Write-Host 'B matches:'
          & $node $file (Join-Path $app 'server') (Join-Path $dirB 'data\app.db')

          # C: is the hash function itself sound on this machine, and which bytes does Node get on stdin?
          $controls = @'
          import { pathToFileURL } from 'node:url'
          import { createRequire } from 'node:module'
          const serverDir = process.argv[2]
          const { hashPassword, verifyPassword } = await import(pathToFileURL(serverDir + '/dist/shared/password.js').href)
          for (const [label, value] of [['ascii', 'abc12345'], ['env-password', process.env.ADMIN_PASSWORD], ['vietnamese-literal', String.fromCodePoint(77, 0x1EAD, 116, 45, 107, 104, 0x1EA9, 117, 45, 49, 50, 51, 52, 53)]]) {
            const stored = await hashPassword(value)
            console.log('round-trip', label, await verifyPassword(value, stored), 'codepoints:', [...value].map((c) => c.codePointAt(0)).join(','))
          }
          console.log('env equals literal:', process.env.ADMIN_PASSWORD === String.fromCodePoint(77, 0x1EAD, 116, 45, 107, 104, 0x1EA9, 117, 45, 49, 50, 51, 52, 53))
          '@
          $controlsFile = Join-Path $env:RUNNER_TEMP 'controls.mjs'
          Set-Content -Path $controlsFile -Value $controls -Encoding UTF8
          Write-Host 'C controls:'
          & $node $controlsFile (Join-Path $app 'server')

          $dump = 'let n=0;const c=[];process.stdin.on("data",d=>c.push(d));process.stdin.on("end",()=>console.log("node received:",Buffer.concat(c).toString("hex").match(/../g).join(" ")))'
          $startInfo = New-Object Diagnostics.ProcessStartInfo
          $startInfo.FileName = $node
          $startInfo.Arguments = "-e `"$($dump -replace '"','\"')`""
          $startInfo.UseShellExecute = $false; $startInfo.CreateNoWindow = $true
          $startInfo.RedirectStandardInput = $true; $startInfo.RedirectStandardOutput = $true
          $process = [Diagnostics.Process]::Start($startInfo)
          $process.StandardInput.BaseStream.Write($bytes, 0, $bytes.Length)
          $process.StandardInput.Close()
          Write-Host $process.StandardOutput.ReadToEnd()
          $process.WaitForExit()

      # Only on failure: what the scheduled task did, who may write where, and what the server says
      # when started by hand as Administrator (same node.exe, same arguments as the task).
      - name: Diagnostics
        if: failure()
        shell: powershell
        run: |
          $app = Join-Path $env:ProgramFiles 'QuanLyCongNo\app'
          $data = Join-Path $env:ProgramData 'QuanLyCongNo'
          Write-Host '--- scheduled task'
          schtasks.exe /Query /TN $env:TASK_NAME /V /FO LIST
          Write-Host '--- task info'
          Get-ScheduledTaskInfo -TaskName $env:TASK_NAME | Format-List *
          Write-Host '--- node processes'
          Get-CimInstance Win32_Process -Filter "Name = 'node.exe'" | Select-Object ProcessId, ExecutablePath, CommandLine | Format-List
          Write-Host '--- data dir'
          Get-ChildItem $data -Recurse -Force | Select-Object FullName, Length | Format-Table -AutoSize -Wrap
          Write-Host '--- ACL: data dir, runtime'
          icacls.exe $data
          icacls.exe (Join-Path $app 'runtime\node.exe')
          Write-Host '--- manual start as Administrator (10 s)'
          $out = Join-Path $env:RUNNER_TEMP 'manual.out'; $err = Join-Path $env:RUNNER_TEMP 'manual.err'
          $proc = Start-Process -FilePath (Join-Path $app 'runtime\node.exe') `
            -ArgumentList "`"$(Join-Path $app 'server\dist\main.js')`"", 'supervise', '--data-dir', "`"$data`"", '--web-root', "`"$(Join-Path $app 'web')`"" `
            -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 10
          try { Write-Host ('health: ' + (Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$env:PORT/api/health").Content) } catch { Write-Host "health: $($_.Exception.Message)" }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force } else { Write-Host "exited with $($proc.ExitCode)" }
          Write-Host '--- stdout'; Get-Content $out -ErrorAction SilentlyContinue
          Write-Host '--- stderr'; Get-Content $err -ErrorAction SilentlyContinue
          Write-Host '--- app logs'
          Get-ChildItem (Join-Path $data 'logs') -Filter 'app*' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.Name; Get-Content $_.FullName | Select-Object -Last 30 }

      - name: Collect logs
        if: always()
        shell: powershell
        run: |
          $logs = Join-Path $env:ProgramData 'QuanLyCongNo\logs'
          if (Test-Path $logs) { Copy-Item $logs "$env:RUNNER_TEMP\qlcn-logs" -Recurse }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke-logs
          path: ${{ runner.temp }}/qlcn-logs
          if-no-files-found: ignore
